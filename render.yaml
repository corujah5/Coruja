services:
  - type: web
    name: coruja-time
    runtime: node
    plan: starter
    buildCommand: npm install --no-audit --no-fund
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: TMDB_TOKEN
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: DATA_DIR
        value: /var/data
      - key: UPLOAD_DIR
        value: /var/data/uploads
    disk:
      name: coruja-data
      mountPath: /var/data
      sizeGB: 1
